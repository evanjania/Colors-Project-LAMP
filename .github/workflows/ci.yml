name: CI – Lint and Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ── Job 1: Super Linter ──────────────────────────
  lint:
    name: Lint (Super Linter)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Super Linter
        uses: super-linter/super-linter@v7
        env:
          DEFAULT_BRANCH: master
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Validate JS and PHP only (adjust as needed)
          VALIDATE_JAVASCRIPT_ES: true
          VALIDATE_PHP_BUILTIN: true
          VALIDATE_CSS: true
          VALIDATE_HTML: true

  # ── Job 2: Jest Tests  ────────────────────────────────────────────────
  test:
    name: Run Jest Tests
    runs-on: ubuntu-latest
    # Tests run even if lint has warnings; fail only on test errors
    needs: []

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
